name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Put errors on the summary page
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -n -E "^e: |error:|FAILED|FAILURE:|What went wrong|Caused by:" -A 3 build-log.txt | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: SPACE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
